# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    # Both loader modules are built. NeoForge is in the matrix because it spent the fork's whole
    # history uncompilable without anyone noticing -- nothing was watching it. fail-fast is off so a
    # break in one loader still reports the other's result instead of cancelling it.
    strategy:
      fail-fast: false
      matrix:
        module: [Fabric, NeoForge]

    name: build (${{ matrix.module }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          # Names have to be unique across the matrix or the second upload collides with the first.
          name: Artifacts-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/
